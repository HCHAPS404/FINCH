# FINCH pull request gate — README §44.
#
# Every job here produces evidence, not just a pass/fail. Constitution §4.11: changes
# that reach production pass through CI and produce artifacts.
#
# Hardening (README §43):
#   - least-privilege `permissions` at workflow level, widened only per job
#   - third-party actions pinned by commit SHA, never by a mutable tag.
#     Each SHA below was resolved from the action's latest release tag via the GitHub
#     API on 2026-09-17; the trailing comment records which tag it corresponds to so a
#     future bump starts from a true baseline rather than a guess.
#   - frozen lockfile, so CI installs exactly what was reviewed
name: PR Gate

on:
  pull_request:
    # ADR-0040: weekly stage branches integrate task branches before a milestone merge to main.
    branches: [main, "stage/**", "area/**"]
  push:
    branches: [main]

# Deny by default; each job requests only what it needs.
permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the toolchain, mirroring .nvmrc and package.json.
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "11.26.0"

jobs:
  # ---------------------------------------------------------------------------
  quality:
    name: Lint · Typecheck · Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Agent rules and skills (.ai/) must match every generated adapter
      # (Claude, Cursor, Codex, Antigravity) — drift fails the build.
      - name: Agent context in sync
        run: pnpm ai:check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # --self-test plants a deliberate boundary violation and asserts the checker
      # rejects it. A fitness function that has silently stopped working would
      # otherwise report green forever (README §102.15).
      - name: Architecture fitness (with self-test)
        run: node scripts/architecture-check.mjs --self-test --artifact

      - name: Upload architecture artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-check
          path: artifacts/architecture-check.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  test:
    name: Unit · Financial correctness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Financial correctness harness
        run: pnpm financial:verify

      - name: Upload financial correctness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: financial-correctness
          path: artifacts/financial-correctness.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Migrations, seeds, constraints and append-only guards against real PostgreSQL 18.6
  # (README §73: PostgreSQL integration with Testcontainers). GitHub-hosted Ubuntu
  # runners provide Docker.
  integration:
    name: Integration · PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Integration tests
        run: pnpm test:integration

  # ---------------------------------------------------------------------------
  # The API container must keep building: it is the deploy artifact (ADR-0038).
  container:
    name: Container · API image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t finch-api:${{ github.sha }} .

      - name: Image runs as a non-root user
        run: test "$(docker run --rm finch-api:${{ github.sha }} id -un)" = "node"

  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in the head commit is still a leaked secret.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  codeql:
    name: Static analysis (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

  # ---------------------------------------------------------------------------
  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # sbom-action writes output-file with a plain file open; the directory must exist.
      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: artifacts/sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: artifacts/sbom.spdx.json
          if-no-files-found: warn
