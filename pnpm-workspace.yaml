packages:
  - "apps/*"
  - "packages/*"
  - "jurisdictions/*"
allowBuilds:
  # protobufjs is a transitive dep of the OTel OTLP exporters (@finch/observability),
  # pulled in for its protobuf type definitions. FINCH uses the default JSON OTLP
  # encoding, not protobuf, so its install script buys us nothing — denied rather than
  # run unreviewed (README §43: dependency scripts are opt-in, not implicit).
  protobufjs: false
  # cpu-features/ssh2 are transitive deps of testcontainers/dockerode, used only for
  # connecting to a remote Docker host over SSH. FINCH's local dev and CI both talk to
  # a local Docker daemon directly, so this path is never exercised — denied rather
  # than run unreviewed native-addon install scripts.
  cpu-features: false
  ssh2: false
  # esbuild's install script only fetches its own official prebuilt binary for the
  # current OS/arch (no arbitrary third-party code) and drizzle-kit's CLI cannot load
  # its TypeScript config without it — approved, unlike the denied scripts above.
  esbuild: true
